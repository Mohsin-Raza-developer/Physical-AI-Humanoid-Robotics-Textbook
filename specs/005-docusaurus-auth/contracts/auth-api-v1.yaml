# API Contracts: Docusaurus Authentication System

**Feature**: 005-docusaurus-auth  
**Date**: 2025-12-13  
**Version**: 1.0

## Overview

This document defines the API contracts for the Docusaurus Authentication System based on the functional requirements in the feature specification. The API follows REST conventions and is implemented as Next.js API routes.

## Authentication API

### User Registration

**Endpoint**: `POST /api/auth/register`

**Description**: Register a new user with email, password, and onboarding questions

**Request**:
```json
{
  "email": "user@example.com",
  "password": "SecurePass123!",
  "softwareLevel": "Intermediate",
  "hardwareAccess": "RTX GPU"
}
```

**Request Validation**:
- Email: Required, valid email format
- Password: Required, 8+ chars, mixed case, number, special char
- SoftwareLevel: Required, one of ["Beginner", "Intermediate", "Advanced"]
- HardwareAccess: Required, one of ["Laptop/Cloud", "RTX GPU", "Jetson Edge", "Physical Robot"]

**Response (Success - 201)**:
```json
{
  "success": true,
  "message": "User registered successfully",
  "data": {
    "userId": "uuid-string",
    "email": "user@example.com",
    "createdAt": "2023-01-01T00:00:00.000Z"
  }
}
```

**Response (Validation Error - 400)**:
```json
{
  "success": false,
  "message": "Validation failed",
  "errors": [
    {
      "field": "email",
      "message": "Invalid email format"
    }
  ]
}
```

**Response (Conflict - 409)**:
```json
{
  "success": false,
  "message": "Email already registered"
}
```

### User Login

**Endpoint**: `POST /api/auth/login`

**Description**: Authenticate user with email and password

**Request**:
```json
{
  "email": "user@example.com",
  "password": "SecurePass123!"
}
```

**Request Validation**:
- Email: Required, valid email format
- Password: Required

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Login successful",
  "data": {
    "userId": "uuid-string",
    "email": "user@example.com",
    "sessionTimeout": "7776000000"  // 30 days in milliseconds
  }
}
```

**Response (Unauthorized - 401)**:
```json
{
  "success": false,
  "message": "Invalid email or password"
}
```

### User Logout

**Endpoint**: `POST /api/auth/logout`

**Description**: Terminate user session

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Logged out successfully"
}
```

### Get Current User Profile

**Endpoint**: `GET /api/auth/profile`

**Description**: Retrieve current authenticated user's profile

**Response (Success - 200)**:
```json
{
  "success": true,
  "data": {
    "id": "uuid-string",
    "email": "user@example.com",
    "softwareLevel": "Intermediate",
    "hardwareAccess": "RTX GPU",
    "createdAt": "2023-01-01T00:00:00.000Z",
    "lastLoginAt": "2023-01-01T12:00:00.000Z"
  }
}
```

### Update User Profile

**Endpoint**: `PUT /api/auth/profile`

**Description**: Update user's profile information

**Request**:
```json
{
  "softwareLevel": "Advanced",
  "hardwareAccess": "Physical Robot"
}
```

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Profile updated successfully",
  "data": {
    "id": "uuid-string",
    "email": "user@example.com",
    "softwareLevel": "Advanced",
    "hardwareAccess": "Physical Robot",
    "updatedAt": "2023-01-01T12:00:00.000Z"
  }
}
```

## Password Management API

### Request Password Reset

**Endpoint**: `POST /api/auth/reset-password/request`

**Description**: Initiate password reset process by sending reset email

**Request**:
```json
{
  "email": "user@example.com"
}
```

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Password reset email sent if email exists"
}
```

### Validate Reset Token

**Endpoint**: `GET /api/auth/reset-password/validate?token={token}`

**Description**: Check if reset token is valid and not expired

**Response (Valid - 200)**:
```json
{
  "success": true,
  "valid": true,
  "expiresAt": "2023-01-01T13:00:00.000Z"
}
```

**Response (Invalid - 400)**:
```json
{
  "success": false,
  "valid": false, 
  "message": "Invalid or expired token"
}
```

### Complete Password Reset

**Endpoint**: `POST /api/auth/reset-password/complete`

**Description**: Complete password reset with new password

**Request**:
```json
{
  "token": "reset-token-string",
  "newPassword": "NewSecurePass456!"
}
```

**Request Validation**:
- Token: Required
- NewPassword: Required, 8+ chars, mixed case, number, special char

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Password reset successfully"
}
```

**Response (Error - 400)**:
```json
{
  "success": false,
  "message": "Invalid or expired token"
}
```

## Account Management API

### Delete Account

**Endpoint**: `DELETE /api/auth/account`

**Description**: Permanently delete user account and all associated data

**Response (Success - 200)**:
```json
{
  "success": true,
  "message": "Account deleted successfully"
}
```

**Response (Error - 401)**:
```json
{
  "success": false,
  "message": "Authentication required"
}
```

## Error Response Format

All error responses follow this format:

```json
{
  "success": false,
  "message": "Error message",
  "timestamp": "2023-01-01T00:00:00.000Z",
  "path": "/api/auth/endpoint"
}
```

## Security Requirements

1. All authenticated endpoints require valid session/cookie
2. Password reset tokens expire after 1 hour
3. Rate limiting applied to registration and login endpoints
4. Passwords must meet specified requirements (8+ chars, mixed case, number, special char)
5. All sensitive data transmitted over HTTPS